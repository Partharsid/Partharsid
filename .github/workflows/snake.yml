name: Snake

# Draws a snake eating the contribution graph, in partharsid.dev's colours,
# and publishes it to the `output` branch for the README.

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#3fcb7f&color_dots=#16171c,#2e2553,#4e3d8f,#7b65c8,#bcaaf5
            dist/snake-light.svg?color_snake=#3fcb7f&color_dots=#ebedf0,#ddd6f8,#b6a6f0,#9984d8,#5b47a8

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: "Update snake"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
